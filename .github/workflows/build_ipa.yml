name: Build IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      variant:
        description: "Base tweak to build in"
        default: "youpro"
        required: true
        type: choice
        options:
          - youpro
          - ytlite
          - ytkplus
          - youmod
          - ytkace
          - custom
          - none

      deb_url:
        description: "Only for variant=custom: URL to your custom .deb (e.g. YTLite/YTKACE/YouTubeX)"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      opensafari:
        description: "Integrate Open in YouTube (Safari Extension)"
        default: true
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      isponsorblock:
        description: "Integrate iSponsorBlock(21.25.5+ incompatible)"
        default: false
        required: false
        type: boolean

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD(21.25.5+ incompatible)"
        default: false
        required: false
        type: boolean

      ryd:
        description: "Integrate Return YouTube Dislikes"
        default: true
        required: false
        type: boolean

      ytabconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: true
        required: false
        type: boolean

      youchoose:
        description: "Integrate YouChooseQuality"
        default: true
        required: false
        type: boolean

      youslider:
        description: "Integrate YouSlider"
        default: false
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks(20.10.4+)"
        default: true
        required: false
        type: boolean

      gonerino:
        description: "Integrate Gonerino(21.25.5+)"
        default: false
        required: false
        type: boolean

      yougetcaption:
        description: "Integrate YouGetCaption"
        default: false
        required: false
        type: boolean

      youspeed:
        description: "Integrate YouSpeed"
        default: false
        required: false
        type: boolean

      youmute:
        description: "Integrate YouMute"
        default: false
        required: false
        type: boolean

      youloop:
        description: "Integrate YouLoop"
        default: false
        required: false
        type: boolean

      ythold:
        description: "Integrate YTHoldForSpeed (ignored for youpro)"
        default: false
        required: false
        type: boolean

      volumeboost:
        description: "Integrate VolumeBoostYT(iOS16+)"
        default: false
        required: false
        type: boolean

      nativeshare:
        description: "Integrate YTNativeShare(19.35.3+) (ignored for youpro)"
        default: false
        required: false
        type: boolean

      pleasedontstopthemusic:
        description: "Integrate PleaseDontStopTheMusic (ignored for youpro)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.variant }} IPA
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: variant,bundle_id,display_name,demc,isponsorblock,ythold,volumeboost,nativeshare,opensafari,youpip,ytuhd,ryd,ytabconfig,youquality,youslider,ytweaks,youchoose,gonerino,yougetcaption,youspeed,youmute,youloop,pleasedontstopthemusic

      # ------------------------------------------------------------------
      # Work out per-variant naming + which options are allowed
      # ------------------------------------------------------------------
      - name: Resolve Variant
        id: variant
        env:
          VARIANT: ${{ inputs.variant }}
          IN_YTHOLD: ${{ inputs.ythold }}
          IN_NATIVESHARE: ${{ inputs.nativeshare }}
          IN_PDSTM: ${{ inputs.pleasedontstopthemusic }}
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          IAMYT=false
          case "$VARIANT" in
            youpro)  PREFIX="YouProExtra";      TAG="youproextra-ipa" ; IAMYT=true ;;
            ytlite)  PREFIX="YouTubePlus";      TAG="ytl-ipa" ;;
            ytkplus) PREFIX="YTKillerPlus";     TAG="ytkp-ipa" ;;
            youmod)  PREFIX="YouMod";           TAG="youmod-ipa" ;;
            ytkace)  PREFIX="YTKACE";           TAG="ytkace-ipa" ;;
            custom)  PREFIX="Custom";           TAG="youproextra-customdeb-ipa" ; IAMYT=true ;;
            none)    PREFIX="YouProExtra_IPA";  TAG="youproextra-noytlite-ipa" ; IAMYT=true ;;
            *) echo "::error::Unknown variant: $VARIANT"; exit 1 ;;
          esac

          if [ "$VARIANT" = "custom" ] && [ -z "$DEB_URL" ]; then
            echo "::error::variant=custom needs deb_url"
            exit 1
          fi

          # These three don't work with YouPro
          YTHOLD=$IN_YTHOLD; NATIVESHARE=$IN_NATIVESHARE; PDSTM=$IN_PDSTM
          if [ "$VARIANT" = "youpro" ]; then
            YTHOLD=false; NATIVESHARE=false; PDSTM=false
          fi

          {
            echo "prefix=$PREFIX"
            echo "tag=$TAG"
            echo "iamyt=$IAMYT"
            echo "ythold=$YTHOLD"
            echo "nativeshare=$NATIVESHARE"
            echo "pdstm=$PDSTM"
          } >> "$GITHUB_OUTPUT"

      - name: Download and Validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl -fL --retry 3 --retry-delay 2 -sS "$IPA_URL" -o youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Download and Validate Custom .deb
        if: inputs.variant == 'custom'
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          curl -fL --retry 3 --retry-delay 2 -sS "$DEB_URL" -o maintweak.deb
          deb_type=$(file --mime-type -b maintweak.deb)
          if [[ "$deb_type" != "application/vnd.debian.binary-package" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid .deb. Detected type: $deb_type."
            exit 1
          fi

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted
          APP_DIR=$(ls -d ytextracted/Payload/*.app | head -n 1)
          YT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_DIR/Info.plist")
          if [ -z "$YT_VERSION" ]; then
            echo "::error::Could not read CFBundleVersion from the IPA"
            exit 1
          fi
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV
          rm -rf ytextracted

      - name: Get Commit Hashes
        id: commit_hashes
        uses: ./.github/actions/get-commit-hashes
        with:
          isponsorblock: ${{ inputs.isponsorblock }}
          demc: ${{ inputs.demc }}
          ythold: ${{ steps.variant.outputs.ythold }}
          volumeboost: ${{ inputs.volumeboost }}
          nativeshare: ${{ steps.variant.outputs.nativeshare }}
          pleasedontstopthemusic: ${{ steps.variant.outputs.pdstm }}

      - name: Install Dependencies
        run: |
          brew uninstall --ignore-dependencies bicep || true
          brew untap aws/tap azure/bicep || true
          brew install --quiet make ldid swiftlint dpkg meson ninja go

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: ./.github/actions/cache-theos
        with:
          theos_commit: ${{ steps.commit_hashes.outputs.theos }}

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan and tbd
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet --no-verbose "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd

      - name: Clone Open in YouTube (Safari Extension)
        if: inputs.opensafari == true
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout
          mv *.appex ${{ github.workspace }}

      - name: Clone YouTubeHeader
        run: |
          rm -rf $THEOS/include/YouTubeHeader
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git $THEOS/include/YouTubeHeader
          if [ "${{ inputs.demc }}" = "true" ]; then
            rm -rf $THEOS/include/YTHeaders
            cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          fi

      - name: Clone PSHeader
        run: |
          rm -rf $THEOS/include/PSHeader
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git $THEOS/include/PSHeader

      - name: Clone YTVideoOverlay
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Cache Tweaks
        id: cache_tweaks
        uses: ./.github/actions/cache-tweaks
        with:
          sdk_version: '18.6'
          isponsorblock: ${{ inputs.isponsorblock }}
          demc: ${{ inputs.demc }}
          ythold: ${{ steps.variant.outputs.ythold }}
          volumeboost: ${{ inputs.volumeboost }}
          nativeshare: ${{ steps.variant.outputs.nativeshare }}
          youpip: ${{ inputs.youpip }}
          ytuhd: ${{ inputs.ytuhd }}
          ryd: ${{ inputs.ryd }}
          ytabconfig: ${{ inputs.ytabconfig }}
          youquality: ${{ inputs.youquality }}
          youchoose: ${{ inputs.youchoose }}
          gonerino: ${{ inputs.gonerino }}
          yougetcaption: ${{ inputs.yougetcaption }}
          youslider: ${{ inputs.youslider }}
          ytweaks: ${{ inputs.ytweaks }}
          youspeed: ${{ inputs.youspeed }}
          youmute: ${{ inputs.youmute }}
          youloop: ${{ inputs.youloop }}
          alderis: ${{ inputs.youslider }}
          pleasedontstopthemusic: ${{ steps.variant.outputs.pdstm }}
          theos_commit: ${{ steps.commit_hashes.outputs.theos }}
          youpip_commit: ${{ steps.commit_hashes.outputs.youpip }}
          ytuhd_commit: ${{ steps.commit_hashes.outputs.ytuhd }}
          ryd_commit: ${{ steps.commit_hashes.outputs.ryd }}
          ygs_commit: ${{ steps.commit_hashes.outputs.ygs }}
          ytvo_commit: ${{ steps.commit_hashes.outputs.ytvo }}
          ytabconfig_commit: ${{ steps.commit_hashes.outputs.ytabconfig }}
          youquality_commit: ${{ steps.commit_hashes.outputs.youquality }}
          youspeed_commit: ${{ steps.commit_hashes.outputs.youspeed }}
          youmute_commit: ${{ steps.commit_hashes.outputs.youmute }}
          youloop_commit: ${{ steps.commit_hashes.outputs.youloop }}
          alderis_commit: ${{ steps.commit_hashes.outputs.alderis }}
          youslider_commit: ${{ steps.commit_hashes.outputs.youslider }}
          youchoose_commit: ${{ steps.commit_hashes.outputs.youchoose }}
          gonerino_commit: ${{ steps.commit_hashes.outputs.gonerino }}
          ytweaks_commit: ${{ steps.commit_hashes.outputs.ytweaks }}
          yougetcaption_commit: ${{ steps.commit_hashes.outputs.yougetcaption }}
          iamyoutube_commit: ${{ steps.commit_hashes.outputs.iamyoutube }}
          isponsorblock_commit: ${{ steps.commit_hashes.outputs.isponsorblock }}
          demc_commit: ${{ steps.commit_hashes.outputs.demc }}
          ythold_commit: ${{ steps.commit_hashes.outputs.ythold }}
          volumeboost_commit: ${{ steps.commit_hashes.outputs.volumeboost }}
          nativeshare_commit: ${{ steps.commit_hashes.outputs.nativeshare }}
          youfixplaybackissues_commit: ${{ steps.commit_hashes.outputs.youfixplaybackissues }}
          pleasedontstopthemusic_commit: ${{ steps.commit_hashes.outputs.pleasedontstopthemusic }}

      - name: Build YTVideoOverlay
        if: steps.cache_tweaks.outputs.cache_ytvo_hit != 'true'
        run: |
          cd YTVideoOverlay && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb

      # ------------------------------------------------------------------
      # Base tweak (one of these runs; each produces maintweak.deb)
      # ------------------------------------------------------------------
      - name: Clone and Build YouPro
        if: inputs.variant == 'youpro'
        run: |
          git clone --quiet --depth=1 https://github.com/mrdrvt99/YouPro.git
          cd YouPro
          chmod -R 755 .
          dpkg-deb --root-owner-group -Zgzip --build . ../maintweak.deb

      - name: Clone and Build YTLite
        if: inputs.variant == 'ytlite'
        run: |
          git clone --quiet --depth=1 https://github.com/mrdrvt99/YTL.git
          cd YTL
          chmod -R 755 .
          dpkg-deb --root-owner-group -Zgzip --build . ../maintweak.deb

      - name: Clone and Build YTKillerPlus
        if: inputs.variant == 'ytkplus'
        run: |
          git clone --quiet --depth=1 https://git.0x0.st/mrdrvt99/YTKP.git
          cd YTKP
          chmod -R 755 .
          dpkg-deb --root-owner-group -Zgzip --build . ../maintweak.deb

      - name: Clone and Build YouMod
        if: inputs.variant == 'youmod'
        run: |
          git clone --quiet --depth=1 https://github.com/tonwalter888/youmod.git
          cd youmod
          find Files -type f \( -name "*.h" -o -name "*.x" -o -name "*.m" \) -exec perl -pi -e 's/#import <roothide\.h>/#import <rootless.h>\n#define jbroot(path) ROOT_PATH_NS(path)/g' {} +
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/maintweak.deb

      - name: Clone and Build YTKACE
        if: inputs.variant == 'ytkace'
        run: |
          git clone --quiet --depth=1 https://github.com/itzzace/ytkace.git
          cd ytkace
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/maintweak.deb

      - name: Get Base Tweak Version
        if: inputs.variant != 'none'
        run: |
          WS="${{ github.workspace }}"
          TMP=$(mktemp -d)
          cd "$TMP"
          ar x "$WS/maintweak.deb" >/dev/null 2>&1
          if [ -f control.tar.gz ]; then
            tar -xzf control.tar.gz ./control
          elif [ -f control.tar.xz ]; then
            tar -xJf control.tar.xz ./control
          elif [ -f control.tar.zst ]; then
            tar --zstd -xf control.tar.zst ./control
          else
            echo "::error::Could not find control tarball in .deb"
            exit 1
          fi
          VERSION=$(grep '^Version:' control | head -n 1 | awk '{print $2}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from .deb control file"
            exit 1
          fi
          echo "BASE_VERSION=$VERSION" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Optional tweaks
      # ------------------------------------------------------------------
      - name: Clone and Build YouPiP
        if: inputs.youpip == true && steps.cache_tweaks.outputs.cache_youpip_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          cd YouPiP && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youpip.deb

      - name: Clone and Build YTUHD
        if: inputs.ytuhd == true && steps.cache_tweaks.outputs.cache_ytuhd_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git
          cd YTUHD && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytuhd.deb

      - name: Clone and Build Return-YouTube-Dislikes
        if: inputs.ryd == true && steps.cache_tweaks.outputs.cache_ryd_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          cd Return-YouTube-Dislikes && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ryd.deb

      - name: Clone and Build YouGroupSettings
        if: steps.cache_tweaks.outputs.cache_ygs_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
          cd YouGroupSettings && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygs.deb

      - name: Clone and Build YTABConfig
        if: inputs.ytabconfig == true && steps.cache_tweaks.outputs.cache_ytabconfig_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
          cd YTABConfig && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytabconfig.deb

      - name: Clone and Build YouQuality
        if: inputs.youquality == true && steps.cache_tweaks.outputs.cache_youquality_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git
          cd YouQuality && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youquality.deb

      - name: Clone and Build YouChooseQuality
        if: inputs.youchoose == true && steps.cache_tweaks.outputs.cache_youchoose_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouChooseQuality.git
          cd YouChooseQuality && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youchoose.deb

      - name: Clone and Build YouSpeed
        if: inputs.youspeed == true && steps.cache_tweaks.outputs.cache_youspeed_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSpeed.git
          cd YouSpeed && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youspeed.deb

      - name: Clone and Build YouMute
        if: inputs.youmute == true && steps.cache_tweaks.outputs.cache_youmute_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouMute.git
          cd YouMute && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ym.deb

      - name: Clone and Build YouLoop
        if: inputs.youloop == true && steps.cache_tweaks.outputs.cache_youloop_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/bhackel/YouLoop.git
          cd YouLoop && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youloop.deb

      - name: Clone and Build Alderis
        if: inputs.youslider == true && steps.cache_tweaks.outputs.cache_alderis_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/hbang/Alderis.git
          cd Alderis && make clean package DEBUG=0 FINALPACKAGE=1 ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/alderis.deb

      - name: Clone and Build YouSlider
        if: inputs.youslider == true && steps.cache_tweaks.outputs.cache_youslider_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          cd YouSlider && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youslider.deb

      - name: Clone and Build YTweaks
        if: inputs.ytweaks == true && steps.cache_tweaks.outputs.cache_ytweaks_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git
          cd YTweaks && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytweaks.deb

      - name: Clone and Build Gonerino
        if: inputs.gonerino == true && steps.cache_tweaks.outputs.cache_gonerino_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git
          cd Gonerino && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/gonerino.deb

      - name: Clone and Build YouGetCaption
        if: inputs.yougetcaption == true && steps.cache_tweaks.outputs.cache_yougetcaption_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGetCaption.git
          cd YouGetCaption && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygc.deb

      # Only for youpro / custom / none (YTLite, YTKP, YouMod, YTKACE never had it)
      - name: Clone and Build IAmYouTube
        if: steps.variant.outputs.iamyt == 'true' && steps.cache_tweaks.outputs.cache_iamyoutube_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/IAmYouTube.git
          cd IAmYouTube && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/imyt.deb

      - name: Clone and Build DontEatMyContent
        if: inputs.demc == true && steps.cache_tweaks.outputs.cache_demc_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
          cd DontEatMyContent && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/demc.deb

      - name: Clone and Build iSponsorBlock
        if: inputs.isponsorblock == true && steps.cache_tweaks.outputs.cache_isponsorblock_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/Galactic-Dev/iSponsorBlock.git
          cd iSponsorBlock && make clean package DEBUG=0 FINALPACKAGE=1 ROOTLESS=1 TARGET=iphone:clang:18.6:14.0
          mv packages/*.deb ${{ github.workspace }}/isponsorblock.deb

      - name: Clone and Build YTHoldForSpeed
        if: steps.variant.outputs.ythold == 'true' && steps.cache_tweaks.outputs.cache_ythold_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/joshuaseltzer/YTHoldForSpeed.git
          cd YTHoldForSpeed && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 TARGET=iphone:clang:18.6:14.0
          mv packages/*.deb ${{ github.workspace }}/ythold.deb

      - name: Clone and Build VolumeBoostYT
        if: inputs.volumeboost == true && steps.cache_tweaks.outputs.cache_volumeboost_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/candyzp/VolumeBoostYT.git
          cd VolumeBoostYT && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/volumeboost.deb

      - name: Clone and Build YTNativeShare
        if: steps.variant.outputs.nativeshare == 'true' && steps.cache_tweaks.outputs.cache_nativeshare_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/nativeshare.deb

      - name: Clone and Build YouFixPlaybackIssues
        if: steps.cache_tweaks.outputs.cache_youfixplaybackissues_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/mrdrvt99/YouFixPlaybackIssues.git
          cd YouFixPlaybackIssues/YouFixPlaybackIssues && make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:18.6
          mv packages/*.deb ${{ github.workspace }}/youfixplaybackissues.deb

      - name: Clone and Build PleaseDontStopTheMusic
        if: steps.variant.outputs.pdstm == 'true' && steps.cache_tweaks.outputs.cache_pleasedontstopthemusic_hit != 'true'
        run: |
          git clone --quiet --depth=1 https://github.com/mikey820/PleaseDontStopTheMusic.git
          cd PleaseDontStopTheMusic
          make -C rootless clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv rootless/packages/*.deb ${{ github.workspace }}/pleasedontstopthemusic.deb

      # ------------------------------------------------------------------
      # Package
      # ------------------------------------------------------------------
      - name: Inject Tweaks Into IPA
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          OPENSAFARI: ${{ inputs.opensafari }}
          PREFIX: ${{ steps.variant.outputs.prefix }}
          IAMYT: ${{ steps.variant.outputs.iamyt }}
        run: |
          # don't let a cached IAmYouTube leak into variants that never had it
          if [ "$IAMYT" != "true" ]; then rm -f imyt.deb; fi

          tweaks=()
          if [ "$OPENSAFARI" = "true" ] && [ -e "OpenYouTubeSafariExtension.appex" ]; then
            tweaks+=("OpenYouTubeSafariExtension.appex")
          fi
          for f in *.deb; do
            [ -f "$f" ] && tweaks+=("$f")
          done
          if [ ${#tweaks[@]} -eq 0 ]; then
            echo "::error::No tweaks were built or found to inject"
            exit 1
          fi

          if [ -n "$BASE_VERSION" ]; then
            OUT="${PREFIX}_${YT_VERSION}_${BASE_VERSION}.ipa"
          else
            OUT="${PREFIX}_${YT_VERSION}.ipa"
          fi
          cyan -i youtube.ipa -o "$OUT" -uwesf "${tweaks[@]}" -n "$DISPLAY_NAME" -b "$BUNDLE_ID"
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_IPA }}
          path: ${{ env.OUT_IPA }}
          retention-days: 7

      - name: Create a Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ steps.variant.outputs.tag }}
        run: |
          i=1
          while gh release view "${TAG_PREFIX}${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "${TAG_PREFIX}${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${OUT_IPA%.ipa}" \
            --draft \
            "$OUT_IPA"

      - name: Job Summary - Build Complete
        run: echo -e "### 🛠️ Build ${{ inputs.variant }} IPA Complete!" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Draft Release Link
        run: |
          echo -e "### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup
        run: |
          echo -e "### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml And if you want to delete old draft releases you have then here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-draft-releases.yml" >> $GITHUB_STEP_SUMMARY
